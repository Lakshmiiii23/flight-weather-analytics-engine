name: 24/7 Flight & Weather Telemetry Daemon

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: flight-daemon-sync
  cancel-in-progress: false

jobs:
  telemetry-daemon:
    name: Ingest & Correlate Flight Weather to Neon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telemetry Sync to Neon PostgreSQL
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/sync_to_neon.py
